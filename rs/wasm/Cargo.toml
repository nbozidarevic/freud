[package]
name = "freud-wasm"
version = "0.0.0"
edition = "2021"
description = "WebAssembly adapter over freud-core (gated web distribution; kept out of the core crate)"
license = "MIT"

[lib]
name = "freud_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
freud-core = { path = ".." }
wasm-bindgen = "0.2"
