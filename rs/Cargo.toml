[package]
name = "freud-core"
version = "0.0.0"
edition = "2021"

[workspace]
members = [".", "ffi"]
# Plain `cargo build`/`cargo test` at this manifest keep meaning
# "the core only"; adapter crates build via their own manifests.
default-members = ["."]

[lib]
name = "freud_core"
path = "src/lib.rs"

[[bin]]
name = "tokdump"
path = "src/main.rs"

[[bin]]
name = "parsedump"
path = "src/bin/parsedump.rs"

[[bin]]
name = "bfcompile"
path = "src/bin/bfcompile.rs"

[[bin]]
name = "freud"
path = "src/bin/freud.rs"

[[bin]]
name = "freud-bench"
path = "src/bin/freud-bench.rs"
