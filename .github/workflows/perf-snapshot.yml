name: perf-snapshot

# Regeneration path for docs/perf.md (see its freshness mandate):
# run from the Actions tab, download the artifact, commit it.
# Dispatch-only: the per-push `perf` job in ci.yml covers the harness.
on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Generate perf results
        run: ./rs/target/release/freud-bench --write docs/perf.md

      - name: Upload perf doc
        uses: actions/upload-artifact@v4
        with:
          name: perf-doc
          path: docs/perf.md
          if-no-files-found: error
