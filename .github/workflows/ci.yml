name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Unit tests
        run: cargo test --manifest-path rs/Cargo.toml

      - name: Test
        working-directory: tests
        run: python3 test

      - name: Probe emission sample
        run: |
          for f in tests/differential/micro/*.c; do
            echo "=== $f"
            ./rs/target/release/freud compile -c "$f"
          done

  golden-tokenizer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Golden token dump
        run: |
          fail=0
          for f in tests/compile/*.c; do
            n=$(basename "$f" .c)
            ./rs/target/release/tokdump "$f" > /tmp/t.rs || { echo "FAILED: $f"; fail=1; continue; }
            cmp -s /tmp/t.rs "tests/golden/tokdump/$n.tok" || { echo "DIFFERS: $f"; fail=1; }
          done
          exit $fail

  golden-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Golden parse dump
        run: |
          fail=0
          for f in tests/compile/*.c; do
            n=$(basename "$f" .c)
            ./rs/target/release/parsedump "$f" > /tmp/p.rs || { echo "FAILED: $f"; fail=1; continue; }
            cmp -s /tmp/p.rs "tests/golden/parsedump/$n.parse" || { echo "DIFFERS: $f"; cmp -l /tmp/p.rs "tests/golden/parsedump/$n.parse" | head -5; fail=1; }
            echo "$(wc -c < /tmp/p.rs) bytes $f"
          done
          echo "sample:"
          head -c 600 /tmp/p.rs; echo
          exit $fail

      - name: Reject negative fixtures
        run: |
          fail=0
          for f in tests/differential/negative/*.c; do
            if ./rs/target/release/parsedump "$f" >/dev/null 2>&1; then
              echo "ACCEPTED: $f"; fail=1
            fi
          done
          [ $fail -eq 0 ] && echo "all negatives rejected"
          exit $fail

  golden-codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Golden Brainfuck output
        run: |
          fail=0
          for f in tests/compile/*.c; do
            n=$(basename "$f" .c)
            ./rs/target/release/bfcompile "$f" > /tmp/b.rs || { echo "FAILED: $f"; fail=1; continue; }
            cmp -s /tmp/b.rs "tests/golden/bf/$n.bf" || { echo "DIFFERS: $f"; fail=1; }
            echo "$(wc -c < /tmp/b.rs) bytes $f"
          done
          for f in tests/differential/micro/*.c; do
            n=$(basename "$f" .c)
            ./rs/target/release/bfcompile "$f" > /tmp/b.rs || { echo "FAILED: $f"; fail=1; continue; }
            cmp -s /tmp/b.rs "tests/golden/bf/micro_$n.bf" || { echo "DIFFERS: $f"; fail=1; }
          done
          ./rs/target/release/freud compile tests/compile/io.c > /tmp/c.rs || { echo "FAILED: freud compile positional"; fail=1; }
          cmp -s /tmp/c.rs tests/golden/bf/io.bf || { echo "DIFFERS: freud compile positional"; fail=1; }
          ./rs/target/release/freud compile < tests/compile/io.c > /tmp/s.rs || { echo "FAILED: freud compile stdin"; fail=1; }
          cmp -s /tmp/s.rs tests/golden/bf/io.bf || { echo "DIFFERS: freud compile stdin"; fail=1; }
          exit $fail

      - name: Reject error fixtures
        run: |
          fail=0
          for f in tests/differential/compile_errors/*.c; do
            if ./rs/target/release/bfcompile "$f" >/dev/null 2>&1; then
              echo "ACCEPTED: $f"; fail=1
            fi
          done
          [ $fail -eq 0 ] && echo "all compile errors rejected"
          exit $fail

      - name: Show first divergence window
        if: failure()
        run: |
          for f in tests/compile/*.c; do
            n=$(basename "$f" .c)
            ./rs/target/release/bfcompile "$f" 2>/dev/null > /tmp/b.rs
            if ! cmp -s /tmp/b.rs "tests/golden/bf/$n.bf"; then
              echo "first divergence: $f"
              off=$(cmp /tmp/b.rs "tests/golden/bf/$n.bf" | grep -o 'byte [0-9]*' | grep -o '[0-9]*')
              skip=$((off > 150 ? off - 150 : 0))
              dd bs=1 skip=$skip count=300 if=/tmp/b.rs 2>/dev/null; echo
              echo "--- golden ---"
              dd bs=1 skip=$skip count=300 if="tests/golden/bf/$n.bf" 2>/dev/null; echo
              break
            fi
          done

  golden-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Golden run fixtures
        run: |
          fail=0
          for f in tests/run/*.bf; do
            base="${f%.bf}"
            ec_rs=0; timeout 60 ./rs/target/release/freud run -c "$f" -i "$base.in" > /tmp/r.rs 2>&1 || ec_rs=$?
            exp=0; case "$base" in *unbalanced*) exp=1;; esac
            if [ "$ec_rs" != "$exp" ]; then echo "EXIT DIFFERS: $f ($ec_rs vs $exp)"; fail=1; fi
            cmp -s /tmp/r.rs "$base.out" || { echo "DIFFERS: $f"; fail=1; }
          done
          exit $fail

      - name: End-to-end pipeline vs g++ oracle
        run: |
          fail=0
          for f in tests/compile/*.c; do
            base="${f%.c}"
            ./rs/target/release/bfcompile "$f" > /tmp/e.bf || { echo "BFCOMPILE FAILED: $f"; fail=1; continue; }
            timeout 300 ./rs/target/release/freud run -c /tmp/e.bf -i "$base.in" > /tmp/e.rs || { echo "FREUD RUN FAILED: $f"; fail=1; continue; }
            g++ -w "$f" -o /tmp/e.o || { echo "GCC FAILED: $f"; fail=1; continue; }
            /tmp/e.o < "$base.in" > /tmp/e.gcc || { echo "GCC RUN FAILED: $f"; fail=1; continue; }
            cmp -s /tmp/e.rs /tmp/e.gcc || { echo "E2E DIFFERS: $f"; fail=1; }
          done
          exit $fail

  golden-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Golden format fixtures
        run: |
          fail=0
          for f in tests/format/*.in; do
            base="${f%.in}"; n=$(basename "$f" .in)
            ./rs/target/release/freud format -c "$f" > /tmp/f.rs || { echo "FAILED: $f"; fail=1; continue; }
            cmp -s /tmp/f.rs "$base.out" || { echo "DIFFERS: $f"; fail=1; }
            ./rs/target/release/freud format -c "$f" -m > /tmp/fm.rs || { echo "FAILED: $f -m"; fail=1; continue; }
            cmp -s /tmp/fm.rs "tests/golden/format-min/$n.out" || { echo "DIFFERS: $f -m"; fail=1; }
          done
          exit $fail

      - name: Golden CLI cases
        run: |
          fail=0
          t() {
            echo "check: $1"
            ec=0; timeout 60 bash -c "$3" > /tmp/c.rs 2>&1 || ec=$?
            if [ "$ec" != "$2" ]; then echo "EXIT DIFFERS: $1 ($ec vs $2)"; fail=1; fi
            cmp -s /tmp/c.rs "tests/golden/cli/$1.out" || { echo "DIFFERS: $1"; cmp -l /tmp/c.rs "tests/golden/cli/$1.out" | head -5; fail=1; }
          }
          F=./rs/target/release/freud
          t "no-args" 0 "$F"
          t "help" 0 "$F help"
          t "version" 0 "$F --version"
          t "compile-c-missing" 1 "$F -c"
          t "run-no-file" 1 "$F run"
          t "run-c-missing" 1 "$F run -c"
          t "run-i-missing" 1 "$F run -c tests/run/nested.bf -i"
          t "run-o-missing" 1 "$F run -c tests/run/nested.bf -o"
          t "format-c-missing" 1 "$F format -c"
          t "format-o-missing" 1 "$F format -c tests/format/squares.in -o"
          t "run-unknown-flag" 0 "$F run -c tests/run/nested.bf -i tests/run/nested.in -z"
          t "format-i-ignored" 0 "$F format -c tests/format/squares.in -i whatever"
          t "run-missing-input" 1 "$F run -c tests/run/eof.bf -i /nonexistent-xyz"
          t "run-bad-output" 1 "$F run -c tests/run/nested.bf -i tests/run/nested.in -o /nonexistent-dir-xyz/f"
          t "format-bad-output" 1 "$F format -c tests/format/squares.in -o /nonexistent-dir-xyz/f"
          t "run-missing-code" 1 "$F run -c /nonexistent-xyz"
          t "format-missing-code" 1 "$F format -c /nonexistent-xyz"
          t "compile-missing-code" 1 "$F compile -c /nonexistent-xyz"
          t "compile-bare-missing" 1 "$F /nonexistent-xyz"
          timeout 60 $F run -c tests/run/nested.bf -i tests/run/nested.in -o /tmp/c.o || { echo "FAILED: run-to-file"; fail=1; }
          cmp -s /tmp/c.o tests/run/nested.out || { echo "DIFFERS: run-to-file"; fail=1; }
          timeout 60 $F format -c tests/format/squares.in -o /tmp/c.of || { echo "FAILED: format-to-file"; fail=1; }
          cmp -s /tmp/c.of tests/format/squares.out || { echo "DIFFERS: format-to-file"; fail=1; }
          timeout 60 $F run tests/run/nested.bf -i tests/run/nested.in > /tmp/c.rs || { echo "FAILED: run-positional"; fail=1; }
          cmp -s /tmp/c.rs tests/run/nested.out || { echo "DIFFERS: run-positional"; fail=1; }
          timeout 60 $F format tests/format/squares.in > /tmp/c.rs || { echo "FAILED: format-positional"; fail=1; }
          cmp -s /tmp/c.rs tests/format/squares.out || { echo "DIFFERS: format-positional"; fail=1; }
          exit $fail

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --manifest-path rs/Cargo.toml

      - name: Run harness
        run: ./rs/target/release/freud-bench

  c-abi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build shared library
        run: cargo build --release --manifest-path rs/ffi/Cargo.toml

      - name: ABI unit tests
        run: cargo test --release --manifest-path rs/ffi/Cargo.toml

      - name: Build and run C example
        run: |
          cc -std=c11 -Wall -Wextra -Werror rs/ffi/example.c -Irs/ffi \
            -o /tmp/freud_example -Lrs/target/release -lfreud
          if [ "$(uname)" = "Darwin" ]; then
            DYLD_LIBRARY_PATH=rs/target/release /tmp/freud_example
          else
            LD_LIBRARY_PATH=rs/target/release /tmp/freud_example
          fi

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v2

      - name: Unit tests
        run: cargo test --manifest-path rs/wasm/Cargo.toml

      - name: Build web bundle for the demo
        run: wasm-pack build rs/wasm --target web --out-dir demo/pkg

      - name: Build Node bundle and smoke-test
        run: |
          wasm-pack build rs/wasm --target nodejs --out-dir /tmp/freud-node-pkg
          node rs/wasm/smoke.cjs /tmp/freud-node-pkg

      - name: Validate publishable npm package shape
        run: |
          wasm-pack build rs/wasm --target bundler --out-dir /tmp/freud-pkg
          cd /tmp/freud-pkg && npm pack --dry-run
