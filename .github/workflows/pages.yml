name: pages-demo

# Manual-only demo deployment (Phase 7b, gated). The owner enables
# GitHub Pages (Settings -> Pages -> Source: GitHub Actions) and then
# dispatches this workflow. The build steps mirror the verified `wasm`
# CI job; the deploy itself is unverified until the first manual run.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v2

      - name: Build demo bundle
        run: wasm-pack build rs/wasm --target web --out-dir demo/pkg

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
